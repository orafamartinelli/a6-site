# Robô do site A6: lê a planilha "Agenda do site A6" + banners do Drive, gera o site e publica.
# Disparado pelo vigia (worker a6-site-robo) via despertador, quando a planilha/pasta muda, e 1x/dia às 06:00.
name: atualizar
on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'por que rodou'
        required: false
        default: 'manual'
concurrency:
  group: atualizar-site
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZAPI_INSTANCE_ID: ${{ secrets.ZAPI_INSTANCE_ID }}
      ZAPI_TOKEN: ${{ secrets.ZAPI_TOKEN }}
      ZAPI_CLIENT_TOKEN: ${{ secrets.ZAPI_CLIENT_TOKEN }}
      AVISO_FONE: '5544984232574'
      NOTICIAS_URL: ${{ vars.NOTICIAS_URL }}
      A6_DISPARO_KEY: ${{ secrets.A6_DISPARO_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ler planilha e banners
        run: node scripts/agenda-drive.mjs
      - name: Ler notícias novas do WhatsApp
        run: node scripts/noticias-whatsapp.mjs
        continue-on-error: true
      - name: Gerar prévia
        run: node scripts/gerar.mjs --previa
      - name: Avisar linhas com problema na planilha
        run: node scripts/avisar.mjs planilha
      - name: Salvar no repositório
        run: |
          git config user.name "robo-a6-site"
          git config user.email "robo@users.noreply.github.com"
          git add -A conteudo site
          if git diff --cached --quiet; then echo "nada mudou"; echo "MUDOU=0" >> $GITHUB_ENV; else git commit -m "robô: atualização (${{ inputs.motivo }})" && git push && echo "MUDOU=1" >> $GITHUB_ENV; fi
      - name: Publicar prévia
        if: env.MUDOU == '1'
        working-directory: site
        run: npx --yes wrangler@4 pages deploy . --project-name=a6-site-previa --branch=main --commit-dirty=true
      # ── HOSTINGER (site oficial) — desligado até existir a variável HOSTINGER_ATIVO=1 e os segredos FTP ──
      # Gera a versão oficial (indexável, com medição) e espelha site/ no public_html por FTP. Não grava no repositório.
      - name: Publicar na Hostinger (oficial)
        if: vars.HOSTINGER_ATIVO == '1' && (env.MUDOU == '1' || inputs.motivo == 'oficial' || inputs.motivo == 'diario')
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASS }}
          FTP_DIR: ${{ vars.HOSTINGER_DIR || 'public_html' }}
        run: |
          node scripts/gerar.mjs
          sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USER","$FTP_PASS" "$FTP_HOST" -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; mirror -R --only-newer --parallel=4 --exclude-glob _headers --exclude-glob _redirects site/ $FTP_DIR/; bye"
          curl -sf -o /dev/null https://a6producoes.com.br/ && echo "site oficial respondeu 200"
      - name: Avisar matérias novas
        if: env.MUDOU == '1'
        run: node scripts/avisar.mjs noticias
      - name: Avisar falha
        if: failure()
        run: node scripts/avisar.mjs falha
